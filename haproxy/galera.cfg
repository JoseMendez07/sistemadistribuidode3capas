global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

frontend galera_frontend
    bind *:3306
    default_backend galera_backend

backend galera_backend
    mode tcp
    balance roundrobin
    option tcp-check
    server galera1 galera1:3306 check fall 3 rise 2
    server galera2 galera2:3306 check fall 3 rise 2
    server galera3 galera3:3306 check fall 3 rise 2
